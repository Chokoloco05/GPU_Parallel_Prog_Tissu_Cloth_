<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Tissu Cloth</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #c {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #error {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      background: #101114;
    }
    #error.visible { display: grid; }
    #error p {
      max-width: 720px;
      margin: 0;
      line-height: 1.5;
      font-size: 18px;
    }
    code {
      background: #23262d;
      border-radius: 4px;
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="error" role="alert"></div>
  <pre id="info" style="position: fixed; top: 16px; left: 16px; z-index: 999999; display: block; margin: 0; padding: 10px 12px; min-width: 280px; background: rgba(0, 0, 0, 0.78); color: white; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 6px; font: 13px/1.45 Consolas, monospace; white-space: pre-wrap; pointer-events: none;">Chargement des infos...</pre>
  <script>
    if (window.location.protocol === 'file:') {
      const errorBox = document.getElementById('error');
      errorBox.innerHTML = '<p>Cette application doit etre lancee depuis un serveur local. Double-clique sur <code>launch_app.bat</code>, garde la fenetre ouverte, puis ouvre <code>http://127.0.0.1:8000/</code> dans Chrome ou Edge.</p>';
      errorBox.classList.add('visible');
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
